<!doctype html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>

<body data-page="{{SLUG}}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrhead"/>
    </marker>
    <marker id="arr-wm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrhead wm"/>
    </marker>
    <marker id="arr-vla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrhead vla"/>

  </defs>
</svg>
<header class="top">
  <button class="menu" aria-label="開啟目錄" aria-expanded="false">☰</button>

      </footer>
    </article>
  </main>
  <nav class="toc" aria-label="本頁目錄">
    <p class="toc-h">本頁目錄</p>
    {{TOC}}
  </nav>
</div>
<script src="assets/site.js"></script>
